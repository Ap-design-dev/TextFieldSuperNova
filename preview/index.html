#sn-preview-v2{color-scheme:light dark}
#sn-preview-v2 [hidden]{display:none!important}
#sn-preview-v2 .sn-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:52px 0 24px;box-sizing:border-box}
#sn-preview-v2 .sn-product{width:min(375px,100%);background:#fff;color:#1f1f22;border-radius:24px;padding:24px 0;box-sizing:border-box;color-scheme:light;font-family:SNText,sans-serif}
#sn-preview-v2 .sn-label{display:block;text-align:center;font-size:14px;line-height:20px;font-weight:400;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
#sn-preview-v2 .sn-amount{height:50px;display:flex;justify-content:center;align-items:center;margin:4px 0}
#sn-preview-v2 .sn-group{position:relative;display:flex;align-items:center;gap:4px;height:50px;font:600 42px/50px SNDisplay,sans-serif;color:rgba(31,31,34,.65)}
#sn-preview-v2 .sn-group[data-filled=true]{color:#1f1f22}
#sn-preview-v2 .sn-viewport{position:relative;height:50px;min-width:0;overflow:hidden}
#sn-preview-v2 .sn-input{display:block;appearance:none;min-width:0;padding:0;border:0;border-radius:0;margin:0;background:transparent;color:inherit;caret-color:transparent!important;outline:none!important;box-shadow:none!important;font:inherit;line-height:50px;height:50px;box-sizing:content-box;text-align:left;font-variant-numeric:normal;opacity:1;-webkit-text-fill-color:currentColor}
#sn-preview-v2 .sn-caret{position:absolute;top:0;bottom:0;width:2px;background:#1f1f22;pointer-events:none;display:none}
#sn-preview-v2 .sn-group[data-focused=true] .sn-caret{display:block;animation:sn-caret-blink 1s step-end infinite}
@keyframes sn-caret-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){#sn-preview-v2 .sn-group[data-focused=true] .sn-caret{animation:none}}
#sn-preview-v2 .sn-currency{font:inherit;line-height:50px;user-select:none}
#sn-preview-v2 .sn-action{position:absolute;left:calc(100% + 6px);top:0;width:24px;height:50px;border:0;padding:0;background:transparent;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
#sn-preview-v2 .sn-action img{display:block;width:14px;height:15px}
#sn-preview-v2 .sn-action[data-editing=true] img{width:16px;height:16px}
#sn-preview-v2 .sn-description{text-align:center;color:rgba(31,31,34,.65);font-size:14px;line-height:16px;font-weight:400;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
#sn-preview-v2 .sn-description[data-validation=error]{color:#d10032}
#sn-preview-v2 .sn-description[data-validation=warning]{color:#ef4c01}
#sn-preview-v2 .sn-product[data-mode=disabled] .sn-label,#sn-preview-v2 .sn-product[data-mode=disabled] .sn-group,#sn-preview-v2 .sn-product[data-mode=disabled] .sn-description{color:rgba(31,31,34,.35)}
#sn-preview-v2 .sn-suggestions{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 0 4px}
#sn-preview-v2 .sn-chip{border:0;border-radius:6px;background:#f2f4f7;color:#1f1f22;font:400 12px/16px SNText,sans-serif;padding:6px 12px;white-space:nowrap;touch-action:manipulation;opacity:1}
#sn-preview-v2 .sn-chip[aria-pressed=true]{background:#3b3b3e;color:#fff}
#sn-preview-v2 .sn-demo-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(343px,calc(100% - 32px));font-family:system-ui,sans-serif;color:light-dark(#686870,#b4b4bc);font-size:12px;line-height:18px}
#sn-preview-v2 .sn-done{border:0;background:light-dark(#e9e9ed,#303036);color:light-dark(#232329,#ededf1);border-radius:8px;padding:8px 14px;font:500 13px/20px system-ui,sans-serif;touch-action:manipulation}
#sn-preview-v2 .sn-done:disabled{opacity:.5}
#sn-preview-v2 .sn-measure{position:absolute;visibility:hidden;white-space:pre;pointer-events:none;font:inherit}
#sn-preview-v2 .sn-skeleton-label,#sn-preview-v2 .sn-skeleton-description,#sn-preview-v2 .sn-skeleton-amount{display:flex;align-items:center;justify-content:center}
#sn-preview-v2 .sn-skeleton-label{height:20px}
#sn-preview-v2 .sn-skeleton-amount{height:40px;margin:4px 0}
#sn-preview-v2 .sn-skeleton-description{height:16px}
#sn-preview-v2 .sn-skeleton img{display:block}
#sn-preview-v2 .sn-settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-top:18px;font:400 13px/20px system-ui,sans-serif;color:light-dark(#3b3b42,#dddde4)}
#sn-preview-v2 .sn-setting{display:flex;flex-direction:column;gap:6px;min-width:0}
#sn-preview-v2 .sn-settings select,#sn-preview-v2 .sn-settings textarea,#sn-preview-v2 .sn-settings input[type=text]{box-sizing:border-box;max-width:100%;width:100%;padding:9px 10px;border:1px solid light-dark(#d9d9df,#484850);border-radius:8px;background:light-dark(#fff,#232328);color:light-dark(#1f1f22,#f2f2f7);font:400 14px/20px system-ui,sans-serif}
#sn-preview-v2 .sn-settings textarea{resize:vertical;min-height:64px}
#sn-preview-v2 .sn-message-setting,#sn-preview-v2 .sn-options{grid-column:1/-1}
#sn-preview-v2 .sn-options{padding:0}
#sn-preview-v2 .sn-options summary{user-select:none}
#sn-preview-v2 .sn-switches{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:12px}
#sn-preview-v2 .sn-switches label{display:flex;gap:7px;align-items:center;min-height:28px}
#sn-preview-v2 .sn-switches input{accent-color:light-dark(#3b3b3e,#e1e1e7);margin:0}
@media(max-width:460px){#sn-preview-v2 .sn-settings{grid-template-columns:minmax(0,1fr)}}
@media(pointer:coarse){#sn-preview-v2 .sn-chip{position:relative}#sn-preview-v2 .sn-chip::after{content:&#x27;&#x27;;position:absolute;inset:-8px 0}#sn-preview-v2 .sn-action{width:44px;left:calc(100% - 4px)}#sn-preview-v2 .sn-switches label{min-height:44px}#sn-preview-v2 .sn-settings textarea,#sn-preview-v2 .sn-settings input[type=text],#sn-preview-v2 .sn-settings select{font-size:16px}}
