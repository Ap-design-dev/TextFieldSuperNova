name: Native checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Test formatting and caret logic
        run: swift test
      - name: Compile UIKit and SwiftUI for iOS Simulator
        run: xcodebuild -scheme TextFieldSuperNova -destination 'generic/platform=iOS Simulator' -derivedDataPath ../.verification/DerivedData CODE_SIGNING_ALLOWED=NO build
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests, lint and demo APK
        run: gradle :library:testDebugUnitTest :library:lintDebug :demo:assembleDebug
